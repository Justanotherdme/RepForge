name: iOS build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate RepForge app icon
        run: swift Scripts/generate_app_icon.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project RepForge.xcodeproj \
            -scheme RepForge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/repforge-build.log
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RepForge-compiler-diagnostics
          path: /tmp/repforge-build.log
          if-no-files-found: ignore
      - name: Validate embedded Live Activity bundle
        run: |
          APP="build/Build/Products/Release-iphoneos/RepForge.app"
          EXT="$APP/PlugIns/RepForgeLiveActivity.appex"
          test -d "$EXT"
          MAIN_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          EXT_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT/Info.plist")
          test -n "$MAIN_EXEC"
          test -n "$EXT_EXEC"
          test -f "$APP/$MAIN_EXEC"
          test -f "$EXT/$EXT_EXEC"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = "com.apple.widgetkit-extension"
      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RepForge.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload RepForge-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RepForge-unsigned-ipa
          path: RepForge-unsigned.ipa
          if-no-files-found: error
